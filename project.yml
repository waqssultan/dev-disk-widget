name: DevDiskWidget
options:
  bundleIdPrefix: dev.local.devdiskwidget
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # fill in via Xcode Signing & Capabilities (your personal team)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES

targets:
  DevDiskApp:
    type: application
    platform: macOS
    sources:
      - path: DevDiskApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.devdiskwidget.app
        PRODUCT_NAME: DevDiskApp
        INFOPLIST_FILE: DevDiskApp/Info.plist
    dependencies:
      - target: DevDiskWidgetExtension
        embed: true
        codeSign: true

  DevDiskWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: DevDiskWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.devdiskwidget.app.widget
        PRODUCT_NAME: DevDiskWidgetExtension
        INFOPLIST_FILE: DevDiskWidget/Info.plist
        SKIP_INSTALL: YES

schemes:
  DevDiskApp:
    build:
      targets:
        DevDiskApp: all
    run:
      config: Debug
